# Topics as Kubernetes resources (Strimzi Topic Operator creates/updates them).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata: { name: orders, namespace: kafka, labels: { strimzi.io/cluster: my-cluster } }
spec: { partitions: 6, replicas: 3 }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata: { name: payments, namespace: kafka, labels: { strimzi.io/cluster: my-cluster } }
spec: { partitions: 6, replicas: 3 }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata: { name: user-events, namespace: kafka, labels: { strimzi.io/cluster: my-cluster } }
spec: { partitions: 12, replicas: 3 }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata: { name: audit-log, namespace: kafka, labels: { strimzi.io/cluster: my-cluster } }
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"
    cleanup.policy: delete
