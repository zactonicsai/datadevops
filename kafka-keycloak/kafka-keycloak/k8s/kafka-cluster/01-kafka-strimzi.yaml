# Strimzi KRaft Kafka cluster (3 brokers, 3 controllers) in namespace "kafka".
# Prereq: helm install strimzi-kafka-operator oci://quay.io/strimzi-helm/strimzi-kafka-operator -n kafka --create-namespace
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 3
  roles: [controller]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        class: gp3
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 3
  roles: [broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        class: gp3
        deleteClaim: false
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits:   { cpu: "2", memory: 4Gi }
  template:
    pod:
      affinity:
        podAntiAffinity:            # spread brokers across AZs
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { strimzi.io/cluster: my-cluster, strimzi.io/pool-name: broker }
              topologyKey: topology.kubernetes.io/zone
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain          # in-cluster only, no TLS (Kafka UI uses this)
        port: 9092
        type: internal
        tls: false
      - name: tls            # in-cluster, mTLS
        port: 9093
        type: internal
        tls: true
      # Uncomment to expose Kafka outside the cluster via an NLB (per-broker LBs):
      # - name: external
      #   port: 9094
      #   type: loadbalancer
      #   tls: true
      #   configuration:
      #     bootstrap:
      #       annotations:
      #         service.beta.kubernetes.io/aws-load-balancer-type: external
      #         service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      #         service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: "false"
  entityOperator:
    topicOperator: {}      # lets us manage topics as KafkaTopic CRs
    userOperator: {}
