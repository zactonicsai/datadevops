# Pull the Keycloak client secret from AWS Secrets Manager into a k8s Secret.
# Prereqs: External Secrets Operator installed; IRSA role with secretsmanager:GetSecretValue
# on the secret "kafka-ui/keycloak-client"; the secret's JSON is {"client-secret": "..."}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-ui-keycloak
  namespace: kafka
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: kafka-ui-keycloak          # k8s Secret name referenced by the Helm values
  data:
    - secretKey: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENTSECRET
      remoteRef:
        key: kafka-ui/keycloak-client
        property: client-secret
