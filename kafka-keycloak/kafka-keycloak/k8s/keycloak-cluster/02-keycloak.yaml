# Keycloak via the official Keycloak Operator (install: kubectl apply -f the operator manifests from
# https://github.com/keycloak/keycloak-k8s-resources/tree/<version>/kubernetes  in namespace "keycloak")
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 2
  db:
    vendor: postgres
    host: keycloak-db.abc123.us-east-1.rds.amazonaws.com
    port: 5432
    database: keycloak
    usernameSecret: { name: keycloak-db, key: username }
    passwordSecret: { name: keycloak-db, key: password }
  hostname:
    hostname: https://auth.example.com    # becomes the token "iss" -> must equal Kafka UI issuer-uri
    strict: true
  http:
    httpEnabled: true                     # TLS terminates at the ALB
  proxy:
    headers: xforwarded                   # trust ALB's X-Forwarded-* so Keycloak builds https:// URLs
  ingress:
    enabled: false                        # we define our own ALB ingress below
  additionalOptions:
    - name: health-enabled
      value: "true"
    - name: metrics-enabled
      value: "true"
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "2",  memory: 2Gi }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing      # browsers must reach it; use "internal" + private DNS if all users are on VPN
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/REPLACE
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/healthcheck-port: "9000"
    external-dns.alpha.kubernetes.io/hostname: auth.example.com
spec:
  ingressClassName: alb
  rules:
    - host: auth.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service     # created by the operator: <cr-name>-service
                port: { number: 8080 }
