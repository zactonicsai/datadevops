# Gitea = open-source, self-hosted Git service (the Bitbucket/GitHub stand-in).
# Small single-pod setup using SQLite, which is plenty for a lab.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: devops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: devops
  labels: { app: gitea }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gitea }
  template:
    metadata:
      labels: { app: gitea }
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.24
          env:
            - { name: USER_UID, value: "1000" }
            - { name: USER_GID, value: "1000" }
            - { name: GITEA__database__DB_TYPE, value: "sqlite3" }
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            # ROOT_URL must be the address YOU type in the browser
            - { name: GITEA__server__ROOT_URL, value: "http://localhost:3000/" }
            - { name: GITEA__server__SSH_DOMAIN, value: "localhost" }
            - { name: GITEA__server__SSH_PORT, value: "2222" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
          ports:
            - { name: http, containerPort: 3000 }
            - { name: ssh,  containerPort: 22 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /api/healthz, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gitea-data }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: devops
spec:
  type: NodePort
  selector: { app: gitea }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30300 }
    - { name: ssh,  port: 22,   targetPort: 22,   nodePort: 30022 }
