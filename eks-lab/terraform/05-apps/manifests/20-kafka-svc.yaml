# Kafka — the conveyor belt. A headless Service (clusterIP: None) gives the
# pod a stable DNS name, which Kafka must advertise to its clients.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ${namespace}
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
    - name: controller
      port: 9093
