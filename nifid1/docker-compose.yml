services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Issuer must be identical for the browser AND for NiFi, or token
      # validation fails. Both reach Keycloak as "keycloak:8080".
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-nifi.json:/opt/keycloak/data/import/realm-nifi.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '"status": "UP"'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  nifi:
    image: apache/nifi:1.28.1
    container_name: nifi
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/nifi/oidc-entrypoint.sh"]
    environment:
      NIFI_ADMIN_IDENTITY: ${NIFI_ADMIN_IDENTITY:-admin@nifi.local}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-changeMeKeystore123}
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY:-changeMeSensitiveProps123}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/nifi/.well-known/openid-configuration
      OIDC_CLIENT_ID: nifi
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-nifi-client-secret-change-me}
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_PROXY_HOST: "localhost:8443,nifi:8443,127.0.0.1:8443"
    volumes:
      - ./nifi/oidc-entrypoint.sh:/opt/nifi/oidc-entrypoint.sh:ro
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-logs:/opt/nifi/nifi-current/logs
      - nifi-database:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
    ports:
      - "8443:8443"

volumes:
  nifi-conf:
  nifi-state:
  nifi-logs:
  nifi-database:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
